server {
    listen 80;
    listen [::]:80;
    server_name baovethean.com www.baovethean.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://baovethean.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.baovethean.com;

    ssl_certificate /etc/letsencrypt/live/baovethean.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baovethean.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://baovethean.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name baovethean.com;

    ssl_certificate /etc/letsencrypt/live/baovethean.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baovethean.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
