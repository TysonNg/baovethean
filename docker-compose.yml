# PostgreSQL cho phát triển/local VPS. Chạy: docker compose up -d
# Chỉ bind loopback: app trên VPS kết nối được, Internet thì không.
services:
    postgres:
        image: postgres:16-alpine
        container_name: baovethean-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-baovethean}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: ${POSTGRES_DB:-baovethean}
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
