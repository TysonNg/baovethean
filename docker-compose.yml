# PostgreSQL cho phát triển local. Chạy: docker compose up -d
# Dữ liệu được lưu trong volume `pgdata` (bền vững qua các lần rebuild).
services:
    postgres:
        image: postgres:16-alpine
        container_name: baovethean-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: baovethean
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
